User:
  columns:
    first_name:
      type: varchar
      is_null: false
    last_name:
      type: varchar
      is_null: true
      allow_blank: true
    email:
      type: varchar
      is_null: false
      is_unique: true
      is_index: true
      allow_blank: false
    password:
      type: varchar
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    date_joined:
      type: timestamp
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false

# Demo of enums / arrays / CHECK / geometry (see README schema reference).
enums:
  ReviewVerdict:
    - pending
    - approved
    - rejected

# varchar (optional max_length: n → VARCHAR(n); default 255)
# text
Author:
  columns:
    first_name:
      type: varchar
      is_null: false
    last_name:
      type: varchar
      is_null: true
      allow_blank: true
    email:
      type: varchar
      is_null: false
      is_unique: true
      is_index: true
      allow_blank: false

Book:
  columns:
    title:
      type: varchar
      is_null: false
      is_unique: true
      is_index: true
      allow_blank: false
    subtitle:
      type: varchar
      is_null: true
    description:
      type: text
      is_null: true
    published_date:
      type: date
      is_null: true
    isbn:
      type: varchar
      is_null: true
      is_unique: true
      is_index: true
    page_count:
      type: integer
      is_null: true
    author:
      type: Author
      references: Author
      is_index: true
      reverse_name: written_books
    reviewers:
      type: User
      many_to_many: true
      references: User
      is_null: true
      is_unique: false
      is_index: true
      reverse_name: reviewed_books

Review:
  columns:
    book:
      type: Book
      is_index: true
      reverse_name: reviews
    reviewer:
      type: User
      references: User
      reverse_name: reviews
    rating:
      type: integer
      check: "rating >= 1 AND rating <= 5"
    verdict:
      type: ReviewVerdict
      default: pending
      is_null: false
    tags:
      type: varchar[]
      default: '{}'
    review_text:
      type: text
      is_null: true
    review_date:
      type: timestamp
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_approved:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_flagged:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_deleted:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_spam:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_inappropriate:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
    is_harmful:
      type: boolean
      is_null: false
      is_unique: false
      is_index: false
      allow_blank: false
  db_table: reviews
  indexes:
    idx_review_book:
      columns:
        - book
    idx_review_reviewer:
      columns:
        - reviewer

Place:
  columns:
    name:
      type: varchar
      is_null: false
    location:
      type: point
      is_null: false
    bounds:
      type: box
      is_null: true
